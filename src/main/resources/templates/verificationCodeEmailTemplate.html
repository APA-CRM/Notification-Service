<!DOCTYPE html>
<html lang="eng" xmlns="http://www.w3.org/1999/html" xmlns:th="http://www.thymeleaf.org">
<head>
    <title></title>
    <meta charset="UTF-8">
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: Arial, sans-serif;
          background: #f3f3f3;
        }

        .email-container {
          max-width: 600px;
          margin: 40px auto;
          background: #ffffff;
          border: 1px solid #e0e0e0;
          border-radius: 12px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
          padding: 32px;
        }

        .header {
          background: linear-gradient(90deg, #a8e6a1, #71d68a);
          border-radius: 12px 12px 0 0;
          padding: 24px;
          text-align: center;
          color: #1b5e20;
          font-size: 22px;
          font-weight: bold;
        }

        .content {
          text-align: center;
          padding: 20px 20px 10px;
        }

        .content p {
          margin: 10px 0;
        }

        .verification-code-label {
          margin-top: 30px;
          font-size: 16px;
          color: #333;
        }

        .verification-code-block {
          display: inline-block;
          background: #f0fff5;
          border: 2px solid #4caf50;
          border-radius: 12px;
          padding: 16px 32px;
          margin-top: 12px;
          font-weight: bold;
          font-size: 20px;
          color: #1b5e20;
          box-shadow: 0 2px 6px rgba(76, 175, 80, 0.15);
        }

        .footer {
          text-align: center;
          font-size: 13px;
          color: #777;
          margin-top: 30px;
          border-top: 1px solid #e0e0e0;
          padding-top: 16px;
        }

        .note {
          color: #4caf50;
          margin-top: 20px;
        }

        .small {
          color: #999;
          font-size: 12px;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        Verification code
    </div>
    <div class="content">
        <h2>Hello!</h2>
        <p class="verification-code-label">Here is your one-time verification code for restoring a password:</p>
        <div class="verification-code-block"><p th:text="${verificationCode}">1234</p></div>
    </div>

    <div class="footer">
        © 2026 APA-CRM • This is an automatic message
    </div>
</div>
</body>
</html>
